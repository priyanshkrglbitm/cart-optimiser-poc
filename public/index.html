<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBasket</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Map library (Leaflet) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Our code -->
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🛒</span>
      <span>SmartBasket</span>
    </div>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch light or dark theme"></button>
  </header>

  <main class="layout">
    <!-- Left: what to buy, and where to deliver -->
    <aside class="panel">
      <section class="panel-section">
        <h2 class="section-title">Delivery location</h2>
        <div class="row">
          <input id="address-input" type="text" placeholder="Search an area or city, then press Enter" value="Gopalpatti, Pune">
          <button id="detect-location" class="btn btn-ghost" type="button" title="Use my current location" aria-label="Use my current location">📍</button>
        </div>
        <label class="field">
          <span>Pincode</span>
          <input id="pincode-input" type="text" inputmode="numeric" maxlength="6" placeholder="6 digits" value="412307">
        </label>
        <div id="map" class="map"></div>
        <p id="coords" class="hint"></p>
      </section>

      <section class="panel-section">
        <h2 class="section-title">Your basket <span id="item-count" class="count"></span></h2>
        <form id="add-form" class="row">
          <input id="item-input" type="text" placeholder="e.g. amul butter 500g, doodh 1L" autocomplete="off" aria-label="Item to add">
          <button class="btn btn-ghost" type="submit">Add</button>
        </form>
        <div id="presets" class="chips"></div>
        <ul id="basket-list" class="basket-list"></ul>
      </section>

      <button id="compare-btn" class="btn btn-primary btn-block" type="button">Compare prices</button>
      <p id="status" class="hint status" role="status"></p>
    </aside>

    <!-- Right: results (filled in by js/results.js) -->
    <section id="results" class="results" aria-live="polite"></section>
  </main>
</body>
</html>
